<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Videos — MeshMinds</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/futuristic.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/theme.js"></script>

  <div class="page-header">
    <div class="page-header-inner">
      <div class="page-nav" style="padding:0 0 16px;">
        <a class="back-btn" href="subject-options.html">← Back</a>
        <div class="breadcrumb" id="crumb">Loading…</div>
      </div>
      <div class="page-header-eyebrow">🎥 Videos</div>
      <div class="page-header-title" id="pageTitle">Video Lectures</div>
      <div class="page-header-sub" id="path">Loading…</div>
    </div>
  </div>

  <div class="page-content" style="max-width:900px">
    <div id="videoList">
      <div class="loading-pulse"><span></span><span></span><span></span></div>
    </div>
  </div>

  <footer class="site-footer">© 2024 MeshMinds</footer>
  <script src="js/ui.js" defer></script>
  <script type="module">
    import { db } from './js/firebase.js';
    import { collection, query, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const course  = localStorage.getItem('selectedCourse')   || 'B.Tech';
    const branch  = localStorage.getItem('selectedBranch')   || '';
    const sem     = localStorage.getItem('selectedSemester') || '';
    const subject = localStorage.getItem('selectedSubject')  || '';

    document.getElementById('pageTitle').innerText = subject + ' — Videos';
    document.getElementById('path').innerText      = `${branch} · ${sem} · ${subject}`;
    document.getElementById('crumb').innerHTML     =
      `<span>${course}</span> → <span>${branch}</span> → <span>${sem}</span> → <span>${subject}</span> → Videos`;

    const out = document.getElementById('videoList');

    async function load() {
      try {
        const docId = `${course}__${branch}__${sem}__${subject}`;
        const snap  = await getDocs(query(collection(db,'videos',docId,'items'), orderBy('timestamp','desc')));

        if (snap.empty) { out.innerHTML = emptyState('No videos uploaded yet.'); return; }

        out.innerHTML = '';
        snap.forEach(ds => {
          const d     = ds.data();
          const embed = toEmbed(d.youtubeUrl);
          const card  = document.createElement('div');
          card.className = 'video-card reveal';
          card.innerHTML = `
            <div class="video-card-body">
              <div class="resource-badge badge-video" style="margin-bottom:10px">🎥 Video</div>
              <div class="video-title">${esc(d.title || 'Video')}</div>
            </div>
            ${embed
              ? `<iframe class="video-embed" src="${embed}" allowfullscreen loading="lazy" title="${esc(d.title||'')}"></iframe>`
              : `<div class="empty-state" style="padding:20px"><p>Unsupported video URL.</p></div>`}
            ${d.youtubeUrl
              ? `<div style="padding:14px 20px"><a class="glow-btn secondary" href="${esc(d.youtubeUrl)}" target="_blank" rel="noopener" style="font-size:13px">↗ Open on YouTube</a></div>`
              : ''}`;
          out.appendChild(card);
        });
        triggerReveal();
      } catch(e) { out.innerHTML = errorState(e.message); }
    }

    function toEmbed(url) {
      if (!url) return '';
      try {
        if (url.includes('youtube.com/watch')) { const v=new URL(url).searchParams.get('v'); return v?`https://www.youtube.com/embed/${v}`:''; }
        if (url.includes('youtu.be/'))         { const id=url.split('youtu.be/')[1].split('?')[0]; return id?`https://www.youtube.com/embed/${id}`:''; }
        if (url.includes('list='))             { const l=new URL(url).searchParams.get('list'); return l?`https://www.youtube.com/embed/videoseries?list=${l}`:''; }
        if (url.includes('/embed/'))           return url;
      } catch(_) {}
      return '';
    }

    function emptyState(msg) { return `<div class="empty-state"><div class="empty-icon">📭</div><p>${msg}</p></div>`; }
    function errorState(msg) { return `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${esc(msg)}</p></div>`; }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function triggerReveal() { document.querySelectorAll('.reveal').forEach((el,i) => { setTimeout(()=>el.classList.add('visible'), i*80); }); }

    load();
  </script>
</body>
</html>
