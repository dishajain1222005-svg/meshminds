<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PYQ Papers — MeshMinds</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/futuristic.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/theme.js"></script>

  <div class="page-header">
    <div class="page-header-inner">
      <div class="page-nav" style="padding:0 0 16px;">
        <a class="back-btn" href="subject-options.html">← Back</a>
        <div class="breadcrumb" id="crumb">Loading…</div>
      </div>
      <div class="page-header-eyebrow">📚 PYQ Papers</div>
      <div class="page-header-title" id="pageTitle">PYQ Papers</div>
      <div class="page-header-sub" id="ctx">Loading…</div>
    </div>
  </div>

  <div class="page-content" style="max-width:860px">
    <div id="pyqList">
      <div class="loading-pulse"><span></span><span></span><span></span></div>
    </div>
  </div>

  <footer class="site-footer">© 2024 MeshMinds</footer>
  <script src="js/ui.js" defer></script>
  <script type="module">
    import { db } from './js/firebase.js';
    import { collection, query, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const course   = localStorage.getItem('selectedCourse')   || 'B.Tech';
    const branch   = localStorage.getItem('selectedBranch')   || '';
    const semester = localStorage.getItem('selectedSemester') || '';
    const subject  = localStorage.getItem('selectedSubject')  || '';

    document.getElementById('pageTitle').innerText = subject + ' — PYQ';
    document.getElementById('ctx').innerText       = `${branch} · ${semester} · ${subject}`;
    document.getElementById('crumb').innerHTML     =
      `<span>${course}</span> → <span>${branch}</span> → <span>${semester}</span> → <span>${subject}</span> → PYQ`;

    const out = document.getElementById('pyqList');

    (async function load() {
      try {
        const docId = `${course}__${branch}__${semester}__${subject}`;
        const snap  = await getDocs(query(collection(db,'pyq',docId,'items'), orderBy('timestamp','desc')));

        if (snap.empty) { out.innerHTML = emptyState('No PYQ papers uploaded yet.'); return; }

        out.innerHTML = '';
        snap.forEach(ds => {
          const d    = ds.data();
          const link = d.driveLink || '';
          const el   = document.createElement('div');
          el.className = 'resource-card reveal';
          el.innerHTML = `
            <div class="resource-card-left">
              <div class="resource-badge badge-pyq">📚 PYQ</div>
              <div class="resource-title">${esc(d.title)}</div>
              ${d.uploaderName ? `<div class="resource-meta" style="margin-top:6px">By ${esc(d.uploaderName)}</div>` : ''}
            </div>
            <div class="resource-actions">
              ${link
                ? `<a class="glow-btn" href="preview.html?url=${encodeURIComponent(link)}&title=${encodeURIComponent(d.title)}" target="_blank">View Paper</a>`
                : `<span class="small">No file</span>`}
            </div>`;
          out.appendChild(el);
        });
        triggerReveal();
      } catch(e) { out.innerHTML = errorState(e.message); }
    })();

    function emptyState(msg) { return `<div class="empty-state"><div class="empty-icon">📭</div><p>${msg}</p></div>`; }
    function errorState(msg) { return `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${esc(msg)}</p></div>`; }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function triggerReveal() { document.querySelectorAll('.reveal').forEach((el,i) => { setTimeout(()=>el.classList.add('visible'), i*60); }); }
  </script>
</body>
</html>
