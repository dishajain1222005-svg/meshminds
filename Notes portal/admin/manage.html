<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Manage Uploads — MeshMinds</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="stylesheet" href="../css/futuristic.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module" src="../js/theme.js"></script>

  <div class="page-header">
    <div class="page-header-inner">
      <div class="page-nav" style="padding:0 0 16px;">
        <a class="back-btn" href="admin.html">← Admin Panel</a>
      </div>
      <div class="page-header-eyebrow">⚙️ Administration</div>
      <div class="page-header-title">Manage Uploads</div>
      <div class="page-header-sub" id="signedInfo">Checking sign-in…</div>
    </div>
  </div>

  <div style="max-width:1100px;margin:0 auto;padding:24px 24px 80px;">

    <!-- TOP ROW -->
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;">
      <button id="refreshBtn" class="glow-btn">↺ Refresh</button>
    </div>

    <!-- FILTER -->
    <div class="card padded" style="margin-bottom:16px">
      <div style="font-weight:700;font-size:14px;margin-bottom:16px">Filter Uploads</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;">
        <div class="form-group"><label>Course</label><select id="selCourse" class="form-control"></select></div>
        <div class="form-group"><label>Branch</label><select id="selBranch" class="form-control"></select></div>
        <div class="form-group"><label>Semester</label><select id="selSemester" class="form-control"></select></div>
        <div class="form-group"><label>Subject</label><select id="selSubject" class="form-control"></select></div>
        <div class="form-group" style="display:flex;align-items:flex-end;">
          <button id="loadBtn" class="glow-btn" style="width:100%">Load</button>
        </div>
      </div>
      <div id="currentPath" style="font-size:13px;font-weight:600;color:var(--accent);margin-top:10px;">—</div>
    </div>

    <!-- RESULTS -->
    <div class="card padded">
      <div id="itemsList"></div>
      <div id="emptyState" class="empty-state" style="display:none">
        <div class="empty-icon">📭</div>
        <p>No uploads found.</p>
      </div>
      <div id="loadingState" class="loading-pulse" style="display:none">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <footer class="site-footer">© 2024 MeshMinds Admin</footer>

  <script type="module" src="../js/admin-common.js"></script>

  <script type="module">
    import { auth, ADMIN_UID, db } from '../js/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { collection, query, getDocs, orderBy, deleteDoc, doc }
      from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const signedInfo   = document.getElementById('signedInfo');
    const selCourse    = document.getElementById('selCourse');
    const selBranch    = document.getElementById('selBranch');
    const selSemester  = document.getElementById('selSemester');
    const selSubject   = document.getElementById('selSubject');
    const itemsList    = document.getElementById('itemsList');
    const emptyState   = document.getElementById('emptyState');
    const loadingState = document.getElementById('loadingState');
    const pathEl       = document.getElementById('currentPath');

    document.getElementById('refreshBtn').onclick = loadList;
    document.getElementById('loadBtn').onclick    = loadList;

    const COURSES  = ['B.Tech'];
    const BRANCHES = ['CSE','IT','AIML','AIDS','VLSI'];
    const COMMON   = ['Applied Chemistry','Applied Mathematics I','Applied Physics I','Communication Skills','Engineering Graphics','Engineering Mechanics','Electrical Science','Environmental Science','Human Values and Professional Ethics','Indian Constitution','Manufacturing Processes','Programming in C','Workshop Practice'];
    const SBJ = {CSE:{3:['Digital Logic Design','Discrete Mathematics','Data Structures','Object Oriented Programming','Probability, Statistics & Linear Algebra','Foundation of Data Science','Principles of Artificial Intelligence','Computational Methods','Universal Human Values II'],4:['Design and Analysis of Algorithms','Database Management Systems','Computer Organization','Operating Systems','Computer Networks','Software Engineering','Numerical Methods']},IT:{3:['Digital Logic Design','Discrete Mathematics','Data Structures','Object Oriented Programming','Probability, Statistics & Linear Algebra','Foundation of Data Science','Principles of Artificial Intelligence','Computational Methods','Universal Human Values II'],4:['Database Management Systems','Operating Systems','Computer Networks','Web Technologies','Software Engineering','Internet of Things (Intro)']},AIML:{3:['Data Structures','Discrete Mathematics','Probability, Statistics & Linear Algebra','Object Oriented Programming','Foundation of Data Science','Principles of Artificial Intelligence','Machine Learning Basics','Universal Human Values II'],4:['Machine Learning I','Data Mining','Linear Algebra for ML','Statistics for ML','Python for Data Science']},AIDS:{3:['Data Structures','Discrete Mathematics','Probability, Statistics & Linear Algebra','Object Oriented Programming','Foundation of Data Science','Principles of Artificial Intelligence','Data Analysis Basics','Universal Human Values II'],4:['Machine Learning I','Data Visualization','APIs & Data Engineering Basics','Intro to Neural Networks']},VLSI:{3:['Digital Logic Design','Electronic Devices and Circuits','Signals and Systems (Intro)','Fundamentals of VLSI','Discrete Mathematics','Computational Methods'],4:['VLSI Design Basics','CMOS Technology','Microprocessors and Interfacing','Analog Circuits']}};

    function init() {
      selCourse.innerHTML   = COURSES.map(c  => `<option>${c}</option>`).join('');
      selBranch.innerHTML   = BRANCHES.map(b => `<option>${b}</option>`).join('');
      selSemester.innerHTML = [1,2,3,4].map(n => `<option value="${n}">Semester ${n}</option>`).join('');
      fillSubjects(); updatePath();
    }

    function fillSubjects() {
      const b = selBranch.value, s = Number(selSemester.value);
      selSubject.innerHTML = '';
      const arr = (s===1||s===2) ? COMMON : (SBJ[b]?.[s]||[]);
      arr.forEach(x => selSubject.appendChild(new Option(x,x)));
      selSubject.appendChild(new Option('— Other —','__other__'));
      updatePath();
    }

    function updatePath() {
      const sub = selSubject.value === '__other__' ? '—' : selSubject.value;
      pathEl.textContent = `${selCourse.value} · ${selBranch.value} · Semester ${selSemester.value} · ${sub}`;
    }

    selBranch.onchange = selSemester.onchange = fillSubjects;
    selCourse.onchange = selSubject.onchange   = updatePath;
    init();

    onAuthStateChanged(auth, user => {
      if (!user) { signedInfo.innerText = 'Not signed in — login via Admin Panel'; showEmpty('Login required.'); return; }
      if (user.uid !== ADMIN_UID) { signedInfo.innerText = user.email + ' — not authorized'; showEmpty('Access denied.'); return; }
      signedInfo.innerText = '✓ Signed in as ' + user.email;
      loadList();
    });

    async function loadList() {
      if (selSubject.value === '__other__') { alert('Select a subject.'); return; }
      const docId = `${selCourse.value}__${selBranch.value}__Semester ${selSemester.value}__${selSubject.value}`;

      itemsList.innerHTML = '';
      emptyState.style.display   = 'none';
      loadingState.style.display = 'flex';

      const COLS = [
        {key:'notes',label:'Notes',icon:'📝'},
        {key:'pyq',label:'PYQ',icon:'📚'},
        {key:'videos',label:'Video',icon:'🎥'},
        {key:'practicals',label:'Practical',icon:'🔬'}
      ];

      let total = 0;
      for (const col of COLS) {
        try {
          const snap = await getDocs(query(collection(db,col.key,docId,'items'), orderBy('timestamp','desc')));
          snap.forEach(d => { total++; itemsList.appendChild(renderItem(col,docId,d)); });
        } catch(_) {}
      }

      loadingState.style.display = 'none';
      if (!total) { emptyState.style.display = 'flex'; }
    }

    function renderItem(col, docId, snap) {
      const d    = snap.data();
      const link = d.driveLink || d.youtubeUrl || '';
      const card = document.createElement('div');
      card.className = 'item-card';

      card.innerHTML = `
        <div style="flex:1;min-width:0">
          <div class="item-type-badge">${col.icon} ${col.label}</div>
          <div class="item-title">${esc(d.title||'—')}</div>
          <div class="item-meta">${esc(d.uploaderName||'')}${d.description?' · '+esc(d.description.slice(0,70)):''}</div>
        </div>
        <div class="item-actions">
          ${link ? `<a class="glow-btn secondary btn-sm" href="${esc(link)}" target="_blank" rel="noopener">Open</a>` : ''}
          <button class="glow-btn danger btn-sm" data-col="${col.key}" data-doc="${docId}" data-id="${snap.id}">Delete</button>
        </div>`;

      card.querySelector('[data-col]').addEventListener('click', async e => {
        const btn = e.currentTarget;
        if (!confirm(`Delete "${d.title}"? This cannot be undone.`)) return;
        btn.disabled = true; btn.textContent = '…';
        try {
          await deleteDoc(doc(db, btn.dataset.col, btn.dataset.doc, 'items', btn.dataset.id));
          card.remove();
          if (!itemsList.children.length) { emptyState.style.display='flex'; emptyState.querySelector('p').textContent='No uploads found.'; }
        } catch(err) { alert('Error: ' + err.message); btn.disabled=false; btn.textContent='Delete'; }
      });

      return card;
    }

    function showEmpty(msg) {
      loadingState.style.display = 'none';
      itemsList.innerHTML = '';
      emptyState.style.display = 'flex';
      emptyState.querySelector('p').textContent = msg;
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    window.manageRefresh = loadList;
  </script>
</body>
</html>
